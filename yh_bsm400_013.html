		<script>
			// pc,mobile 분기체크
			function isMobile(){
			    var UserAgent = navigator.userAgent;
			    if (UserAgent.match(/iPhone|iPad|iPod|Android|Windows CE|BlackBerry|Symbian|Windows Phone|webOS|Opera Mini|Opera Mobi|POLARIS|IEMobile|lgtelecom|nokia|SonyEricsson|Mobile|Tablet/i) != null || UserAgent.match(/LG|SAMSUNG|Samsung/) != null)
			    {
			        return true;
			    }else{
			        return false;
			    }
			}


			$(document).ready(function() {
				/* 2026.11.04 수정(UI 미러) - 로그인 토큰 갱신 타이머 삭제 (9분마다 /login/refreshTokenReal.do 호출) */



					 $('.quickBtn').show();
				     $('.menu_setting').show();
				     $('.quickBtn').css('display', 'flex');


				 $('.menu_setting').hide();
			});


			function alertPopup(){

				alert("서비스 준비 중입니다.");
			}
		</script>

		<script type="text/javascript">
			$(document).ready(function(){
				window.parent.$("#iFramePop").attr("title", "입교자 검색 팝업");
			});
		</script>
	</head>

	<body>
		<input type="hidden" id="resultMsg" value="" />

		<script type="text/javascript">
			function lfn_doSearch() {
				if($("#searchKeyword").val().trim() == '') {
					alert("검색할 키워드를 입력해 주세요.");
					return;
				}

				$("#searchFrm").submit();
			}

			function lfn_doClear() {
				$("#searchType").val("1");
				$("#searchKeyword").val("");
			}

			function lfn_personSubmit() {
				var flag = false;
				var array = new Array();
				var data = new Object();
				$("[name='radio']").each(function() {
					if($(this).is(":checked")) {
						flag = true;
						var id = $(this).attr("id");

						data.ymFdtnMtacDvCd = $("#person_ymFdtnMtacDvCd"+id).val();
						data.ymFdtnMtacDvCdNm = $("#person_ymFdtnMtacDvCdNm"+id).val();
						data.rcpNo = $("#person_rcpNo"+id).val();
						data.aplKorNm = $("#person_aplKorNm"+id).val();
						data.reqEtrNm = $("#person_reqEtrNm"+id).val();
						data.tskNm = $("#person_tskNm"+id).val();

						array.push(data);
					}
				});

				if(!flag) {
					alert("입교자를 선택해주세요.");
					return;
				} else {
					window.parent.lfn_layerPop_Callback(array);
					window.parent.closeLayerPop();
				}
			}
		</script>
		<div class="lpContainer inputPop personSearch" style="display:block;" role="dialog" aria-modal="true">
			<div class="lpWrap medium">
				<div class="lpHead">
					<p class="title">입교자 검색</p>
				</div>
				<div class="requireBox open" id="requireList" aria-expanded="true">
					<form id="searchFrm" name="searchFrm" method="POST" action="/startkosmes-preview/yh_bsm400_013.html">
						<div class="requireList">
							<div class="formGrid">
								<div class="row">
									<div class="thcell fullFixed">
										<label style="font-weight:lighter;margin-right:20px;">검색조건</label>
										<select id="searchType" name="searchType" title="검색어 입력 선택">
											<option value="2">입교자명</option>
											<option value="3">기업명</option>
										</select>
									</div>
									<div class="tdcell">
										<label style="font-weight:lighter;margin-right:20px;">검색어</label>
										<input type="text" id="searchKeyword" name="searchKeyword" class="dfsize" value="" />
									</div>
								</div>
							</div>
						</div>
						<div class="onConHead_right">
							<ul class="onTitleBtns">
								<li>
									<button type="button" name="" id="" class="btn_reset" onclick="javascript:lfn_doClear();"><span></span></button>
								</li>
								<li>
									<button type="button" name="" id="" class="btn_search" onclick="javascript:lfn_doSearch();"><span>검색</span></button>
								</li>
							</ul>
						</div>
					</form>
				</div>

				<div class="boardListWrap">
					<div class="tableWrap01 scrollTable" style="height:300px;overflow:scroll;">
						<table>
							<caption>
								입교자 검색 리스트
							</caption>
							<colgroup>
								<col style="width:100px;" />
								<col style="width:30%;" />
								<col style="width:20%;" />
								<col style="width:auto;" />
							</colgroup>
							<thead>
								<tr>
									<th scope="col">선택</th>
									<th scope="col">사관학교</th>
									<th scope="col">입교자명</th>
									<th scope="col">기업명</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td colspan="4" class="nodata">조회 결과가 없습니다.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div class="btnWrap center">
					<button type="button" name="" id="" class="btn lightblue" onclick="javascript:lfn_personSubmit();"><span>확인</span></button>
				</div>
				<button type="button" name="" id="" class="closeModal lpClose" onclick="javascript:window.parent.closeLayerPop();">닫기</button>
			</div>
		</div>
	</body>
